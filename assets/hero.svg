<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
<title id="title">Maylo Parra — Software Developer</title>
<desc id="desc">Banner oscuro estilo terminal. Maylo Parra, desarrollo full stack, móvil e integración de IA en Costa Rica.</desc>
<defs>
