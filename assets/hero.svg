<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">Maylo Parra — Full Stack Developer | MayloCode</title>
  <desc id="desc">Banner de MayloCode con una aurora violeta y cian y un hilo luminoso que conecta frontend, backend y aplicaciones móviles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#07070c"/><stop offset=".6" stop-color="#10101a"/><stop offset="1" stop-color="#090b18"/>
    </linearGradient>
    <radialGradient id="violet-glow"><stop stop-color="#8b5cf6" stop-opacity=".33"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan-glow"><stop stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".6"/></linearGradient>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#f4f4f8" stroke-opacity=".035"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="thread-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="388" rx="22"/></clipPath>
    <style>
      .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,'Liberation Mono',monospace}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="390" fill="url(#bg)"/>
    <ellipse cx="310" cy="-10" rx="470" ry="310" fill="url(#violet-glow)"/>
    <ellipse cx="1030" cy="380" rx="450" ry="330" fill="url(#cyan-glow)"/>
    <rect width="1280" height="390" fill="url(#grid)"/>
    <path d="M0 370C230 340 300 390 515 354S910 348 1280 299" fill="none" stroke="url(#light)" stroke-opacity=".24" stroke-width="2"/>
    <g class="sans">
      <rect x="43" y="31" width="38" height="38" rx="11" fill="#10101a" stroke="#22d3ee" stroke-opacity=".58"/>
      <path d="M52 57V43l10 11 10-11v14" stroke="url(#light)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="94" y="57" font-size="23" font-weight="700" letter-spacing="-.8" fill="#f4f4f8">maylo<tspan fill="#22d3ee">code</tspan></text>
      <text x="44" y="120" class="mono" font-size="13" letter-spacing="2.1" fill="#67e8f9">DESARROLLO WEB · SOFTWARE · MÓVIL</text>
      <text x="39" y="218" font-size="87" font-weight="800" letter-spacing="-3.6" fill="#f4f4f8">MAYLO</text>
      <text x="39" y="304" font-size="87" font-weight="800" letter-spacing="-3.6" fill="#f4f4f8">PARRA<tspan fill="#67e8f9">.</tspan></text>
      <text x="44" y="337" font-size="20" font-weight="500" fill="#d4d4e0">Full Stack Developer <tspan fill="#8b5cf6">/</tspan> Costa Rica</text>
      <text x="44" y="359" class="mono" font-size="12" letter-spacing="1" fill="#a1a1b5">INFORMÁTICA EMPRESARIAL · UCR</text>
    </g>
    <rect x="665" y="45" width="571" height="299" rx="20" fill="#10101a" fill-opacity=".93" stroke="url(#stroke)"/>
    <path d="M666 99H1235" stroke="#23233a"/>
    <circle cx="693" cy="72" r="5.5" fill="#8b5cf6"/><circle cx="711" cy="72" r="5.5" fill="#22d3ee"/><circle cx="729" cy="72" r="5.5" fill="#f4f4f8" fill-opacity=".5"/>
    <text x="758" y="78" font-size="14" fill="#d4d4e0" class="mono">CONSTRUYO DE PUNTA A PUNTA</text>
    <rect x="683" y="116" width="535" height="210" rx="13" fill="#07070c" fill-opacity=".4"/>
    <path d="M723 142C723 176 754 185 723 211S693 263 723 295" fill="none" stroke="#22d3ee" stroke-opacity=".15" stroke-width="12" filter="url(#blur)"/>
    <path d="M723 142C723 176 754 185 723 211S693 263 723 295" fill="none" stroke="url(#light)" stroke-width="3" stroke-linecap="round" filter="url(#thread-glow)"/>
    <g fill="#07070c" stroke="#67e8f9" stroke-width="2.5"><circle cx="723" cy="143" r="6"/><circle cx="723" cy="212" r="6"/><circle cx="723" cy="295" r="6"/></g>
    <g class="sans">
      <text x="756" y="143" font-size="12" font-weight="700" letter-spacing="1.7" fill="#67e8f9">01 / FRONTEND</text>
      <text x="756" y="164" font-size="19" font-weight="600" fill="#f4f4f8">React · Angular · TypeScript</text>
      <path d="M757 182H1187" stroke="#23233a"/>
      <text x="756" y="212" font-size="12" font-weight="700" letter-spacing="1.7" fill="#bda9fb">02 / BACKEND</text>
      <text x="756" y="234" font-size="19" font-weight="600" fill="#f4f4f8">.NET · Laravel · SQL</text>
      <path d="M757 254H1187" stroke="#23233a"/>
      <text x="756" y="292" font-size="12" font-weight="700" letter-spacing="1.7" fill="#67e8f9">03 / MOBILE</text>
      <text x="756" y="314" font-size="19" font-weight="600" fill="#f4f4f8">Ionic · Capacitor · APIs</text>
    </g>
    <rect y="386" width="1280" height="4" fill="url(#light)"/>
  </g>
  <rect x="1" y="1" width="1278" height="388" rx="22" fill="none" stroke="#8b5cf6" stroke-opacity=".26" stroke-width="2"/>
</svg>
