 <style>
  .mono{font-family:'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
  .blink{animation:blink 1.15s steps(2,start) infinite}
  .pulse{animation:pulse 2.8s ease-in-out infinite}
  .scan{animation:slide 9s linear infinite}
  @keyframes blink{to{opacity:0}}
  @keyframes pulse{50%{opacity:.42;transform:translate(0,0)}}
  @keyframes slide{from{transform:translateY(-180px)}to{transform:translateY(390px)}}
 </style>
</defs>
