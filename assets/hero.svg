 <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#6EE7F2"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12243A" stop-opacity=".98"/><stop offset="1" stop-color="#0A1628" stop-opacity=".98"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#1A9DB1" stop-opacity=".20"/><stop offset="1" stop-color="#1A9DB1" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#B2D9F2" stroke-opacity=".065" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
